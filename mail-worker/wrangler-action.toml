name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[routes]]
pattern = "mail.theitnotes.space"
custom_domain = true

# The script will handle provisioning these resources dynamically
#[[d1_databases]]
#binding = "db"			
#database_name = ""		
#database_id = ""		

#[[kv_namespaces]]
#binding = "kv"			
#id = ""					

#[[r2_buckets]]
#binding = "r2"			
#bucket_name = ""		

#[[send_email]]
#name = "email"			

[ai]
binding = "ai"

[assets]
binding = "assets"		
directory = "./dist"	
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]	

[vars]
ai_model = "@cf/meta/llama-3.1-8b-instruct-fast"			
analysis_cache = false			
orm_log = false			
domain = ["theitnotes.space"]				
admin = "admin"					
jwt_secret = "7fA9cK2mE5xN8qZ1vW4tPb7jMs0xYcNx3mQ6vL9kR2wB5hN8pZ1vW4tPb7jMs0xY"			

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
